# Table of Contents — controls which topics show up in the app for students.
#
# This file is read by index.html when the app loads. Every topic listed
# here (and not commented out) appears in both the Quiz and Flashcards
# topic pickers, and is included in Quick-Exam's random question pool.
#
# To hide a topic from students without deleting its content from data.js,
# comment out its line by adding a `#` at the start. To show it again later,
# just remove the `#`.
#
# Format: "- <id>  # <topic name, just for readability, the app only reads the id>"
# The id must match a topic's "id" field in data.js.

